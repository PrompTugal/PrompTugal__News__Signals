name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  # No timer (Dinis, 19 Nov 2026: every run starts from a commit). workflow_dispatch is for a person by hand only.
  workflow_dispatch:
permissions:
  contents: read
  deployments: read   # the anchor: CI's own record of the last passing deployment (security@'s fourth ruling)
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every commit since the last release carries an Agent trailer
        # From the last release tag, not github.event.before: GitHub drops a pending run when a
        # newer one queues, and the surviving run's "before" is the dropped push's head, so the
        # dropped push's commits were never checked (specialist.code@ finding 3b).
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          last=$(git describe --tags --abbrev=0 --match "v${VERSION_BASE}.*" "$AFTER" 2>/dev/null || true)
          node scripts/check-commits.mjs "${last:-$BEFORE}" "$AFTER"
      - name: The leak scan's key rules hold (security@'s ruling, 19 Nov 2026)
        run: node scripts/test-leak-scan.mjs
      - name: The deciding step refuses what it should (security@'s third ruling)
        run: scripts/test-deciding-step.sh
      - name: The signature check refuses what it should, for the right reason
        run: node scripts/test-check-signatures.mjs
      - name: Every new commit is signed by its agent's published key (team/keys.json)
        # Dinis, 19 Nov 2026 (PrompTugal__News__Website board/guidance/2026-11-19-signed-commits-paid-search-and-free-embeds.md)
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          last=$(git describe --tags --abbrev=0 --match "v${VERSION_BASE}.*" "$AFTER" 2>/dev/null || true)
          node scripts/check-signatures.mjs "${last:-$BEFORE}" "$AFTER"
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: Leak scan (tracked files and the built site)
        run: node scripts/leak-scan.mjs
      - name: The anchor, the last commit a passing run deployed (security@'s fourth ruling, 948820a7e)
        # CI's own record, which a pusher cannot write: the sha of the newest successful github-pages deployment, read with
        # this run's own read-only token. Tags are not used.
        id: anchor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          A=""
          for id in $(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" "${api}/deployments?environment=github-pages&per_page=50" | jq -r '.[].id'); do
            st=$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" "${api}/deployments/${id}/statuses?per_page=1" | jq -r '.[0].state // empty')
            if [ "$st" = success ]; then A=$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" "${api}/deployments/${id}" | jq -r '.sha'); break; fi
          done
          echo "anchor=${A}" >> "$GITHUB_OUTPUT"
          echo "anchor: ${A:-none}"
      - name: The deciding security checks, from the anchor's copy (security@'s rulings, controls 1 to 8)
        # Every security check and its config (keys, exemptions, trusted base) comes from the anchor A's tree, never from the
        # pushed tree, a tag or the trusted base's copy, and checks the whole range A..AFTER, so the commits of a push whose
        # own run was dropped are checked too. The run fails if A is missing, is not an ancestor of AFTER, or has no copy of a
        # check. The steps above ran the pushed tree's copies as tests only. The workflow file itself still comes from the
        # pushed tree: Dinis's branch protection closes that. scripts/test-deciding-step.sh tests this block as written here.
        env:
          A: ${{ steps.anchor.outputs.anchor }}
          AFTER: ${{ github.sha }}
        run: |
          # deciding-step:begin
          test "$(git rev-parse --is-shallow-repository)" = false || { echo "deciding: shallow checkout refused" >&2; exit 1; }
          case "${A}" in ""|*[!0-9a-f]*|0000000000000000000000000000000000000000) echo "deciding: no anchor (no passing deployment on record): refused" >&2; exit 1;; esac
          git cat-file -e "${A}^{commit}" 2>/dev/null || { echo "deciding: the anchor ${A} is not in this history" >&2; exit 1; }
          git merge-base --is-ancestor "${A}" "${AFTER}" || { echo "deciding: the anchor is not an ancestor of AFTER: refused" >&2; exit 1; }
          for f in check-commits.mjs check-signatures.mjs leak-scan.mjs; do
            git show "${A}:scripts/${f}" > "scripts/${f}.trusted" 2>/dev/null || { echo "deciding: the anchor has no scripts/${f}: refused" >&2; exit 1; }
            mv "scripts/${f}.trusted" "scripts/${f}"
          done
          node scripts/check-commits.mjs "${A}" "${AFTER}"
          node scripts/check-signatures.mjs "${A}" "${AFTER}"
          node scripts/leak-scan.mjs
          # deciding-step:end
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
